<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="344" viewBox="0 0 1280 344" role="img" aria-labelledby="title desc">
  <title id="title">차작 사용자 흐름</title>
  <desc id="desc">녹음하기, 내 멜로디, 노래 만들기, 완성의 네 단계로 이어지는 사용자 흐름</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1C2B45" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="1280" height="344" rx="24" fill="url(#background)"/>
  <text x="48" y="52" fill="#162238" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="22" font-weight="700">차작 사용자 흐름</text>
  <text x="48" y="79" fill="#66758B" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="14">한 소절의 허밍이 나만의 노래가 되기까지</text>

  <g filter="url(#shadow)">
    <rect x="48" y="106" width="272" height="190" rx="18" fill="#FFFFFF"/>
    <rect x="352" y="106" width="272" height="190" rx="18" fill="#FFFFFF"/>
    <rect x="656" y="106" width="272" height="190" rx="18" fill="#FFFFFF"/>
    <rect x="960" y="106" width="272" height="190" rx="18" fill="#FFFFFF"/>
  </g>

  <g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
    <g transform="translate(48 106)">
      <rect x="20" y="20" width="46" height="46" rx="14" fill="#FFF0ED"/>
      <text x="43" y="51" text-anchor="middle" fill="#DE614B" font-size="21" font-weight="800">01</text>
      <text x="20" y="103" fill="#162238" font-size="22" font-weight="700">녹음하기</text>
      <text x="20" y="135" fill="#58677B" font-size="15">한 소절 녹음</text>
      <text x="20" y="160" fill="#58677B" font-size="15">음역·파형 실시간 표시</text>
    </g>
    <g transform="translate(352 106)">
      <rect x="20" y="20" width="46" height="46" rx="14" fill="#EAF4FF"/>
      <text x="43" y="51" text-anchor="middle" fill="#3879C7" font-size="21" font-weight="800">02</text>
      <text x="20" y="103" fill="#162238" font-size="22" font-weight="700">내 멜로디</text>
      <text x="20" y="135" fill="#58677B" font-size="15">허밍을 음표·연주로 변환</text>
      <text x="20" y="160" fill="#58677B" font-size="15">원본 비교·화음·변주</text>
    </g>
    <g transform="translate(656 106)">
      <rect x="20" y="20" width="46" height="46" rx="14" fill="#F1EBFF"/>
      <text x="43" y="51" text-anchor="middle" fill="#7954BB" font-size="21" font-weight="800">03</text>
      <text x="20" y="103" fill="#162238" font-size="22" font-weight="700">노래 만들기</text>
      <text x="20" y="135" fill="#58677B" font-size="15">오늘 드라이브 주제 선택</text>
      <text x="20" y="160" fill="#58677B" font-size="15">곡 구성·가사·표지 생성</text>
    </g>
    <g transform="translate(960 106)">
      <rect x="20" y="20" width="46" height="46" rx="14" fill="#E5F7F0"/>
      <text x="43" y="51" text-anchor="middle" fill="#258562" font-size="21" font-weight="800">04</text>
      <text x="20" y="103" fill="#162238" font-size="22" font-weight="700">완성</text>
      <text x="20" y="135" fill="#58677B" font-size="15">표지·가사와 함께 감상</text>
      <text x="20" y="160" fill="#58677B" font-size="15">버전 관리·말로 수정</text>
    </g>
  </g>

  <g fill="none" stroke="#93A1B5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M326 201h19m-7-7 7 7-7 7"/>
    <path d="M630 201h19m-7-7 7 7-7 7"/>
    <path d="M934 201h19m-7-7 7 7-7 7"/>
  </g>
</svg>
